openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: members
    description: Membership management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /members:
    get:
      operationId: getMembers
      tags: [members]
      summary: Get all members
      responses:
        "200":
          description: All membership records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
  /addMember:
    post:
      operationId: addMember
      tags: [members]
      summary: Add a member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: The new member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: Invalid member data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Member:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        membershipType:
          type: integer
          enum: [1, 2, 3]
        joiningDate:
          type: string
          format: date
        endingDate:
          type: string
          format: date
      required:
        - id
        - name
        - membershipType
        - joiningDate
        - endingDate
    MemberInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        membershipType:
          type: integer
          enum: [1, 2, 3]
      required:
        - name
        - membershipType
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

